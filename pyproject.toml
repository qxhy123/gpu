[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gpusim"
version = "0.1.0"
description = "Teaching-oriented NVIDIA GPU microarchitecture simulator"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pyyaml>=6.0",
  "pyarrow>=15",
  "pandas>=2.1",
  "plotly>=5.18",
  "jinja2>=3.1",
  "typer>=0.9",
  "ml_dtypes>=0.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=4", "ruff>=0.4", "mypy>=1.8"]

[project.scripts]
gpusim = "gpusim.cli:app"

[tool.setuptools.packages.find]
include = ["gpusim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "reference: tests requiring real-GPU reference fixtures (skipped if absent)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
